<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EKart Mini - Admin</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

/* =========================
   LOGIN
========================= */

.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 30px;
    border-radius: 14px;
    border: 1px solid #eee;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.login-logo {
    text-align: center;
    font-size: 26px;
    font-weight: 800;
    color: #6d28d9;
    margin-bottom: 8px;
}

.login-title {
    text-align: center;
    color: #555;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
}

.form-group input:focus {
    border-color: #6d28d9;
}

.login-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #6d28d9;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    background: #4c1d95;
}

.login-btn:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.login-error {
    display: none;
    background: #fee2e2;
    color: #b91c1c;
    padding: 10px;
    border-radius: 7px;
    margin-bottom: 15px;
    font-size: 14px;
}

/* =========================
   ADMIN
========================= */

#adminPage {
    display: none;
}

.header {
    height: 70px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: #6d28d9;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.admin-email {
    font-size: 13px;
    color: #666;
}

.logout-btn {
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    background: #ef4444;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.container {
    width: 90%;
    max-width: 1250px;
    margin: 30px auto;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 22px;
}

.stat-card p {
    color: #777;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-card h2 {
    font-size: 28px;
}

/* =========================
   ORDERS
========================= */

.orders-box {
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 22px;
}

.orders-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.search-box {
    width: 280px;
}

.search-box input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #ddd;
    border-radius: 7px;
    outline: none;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th {
    text-align: left;
    background: #f8f8fb;
    padding: 13px;
    font-size: 13px;
    color: #555;
}

td {
    padding: 14px 13px;
    border-top: 1px solid #eee;
    font-size: 14px;
}

.order-id {
    font-weight: bold;
    color: #6d28d9;
}

.amount {
    font-weight: bold;
}

.status-select {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ddd;
    cursor: pointer;
}

.view-btn {
    border: none;
    background: #6d28d9;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal {
    background: white;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 14px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.close-btn {
    border: none;
    background: none;
    font-size: 27px;
    cursor: pointer;
}

.detail-row {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.detail-row strong {
    display: inline-block;
    width: 120px;
}

.item-box {
    background: #f8f8fb;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 8px;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media(max-width:800px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .orders-header {
        flex-direction: column;
        align-items: stretch;
    }

    .search-box {
        width: 100%;
    }

    .admin-email {
        display: none;
    }

}

</style>

</head>

<body>


<!-- =========================
     LOGIN PAGE
========================= -->

<div
    class="login-page"
    id="loginPage"
>

    <div class="login-box">

        <div class="login-logo">
            🛒 EKart Mini
        </div>

        <p class="login-title">
            Admin Login
        </p>

        <div
            class="login-error"
            id="loginError"
        ></div>

        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>

    </div>

</div>



<!-- =========================
     ADMIN PAGE
========================= -->

<div id="adminPage">

<header class="header">

    <div class="logo">
        🛒 EKart Mini
    </div>

    <div class="header-right">

        <span
            class="admin-email"
            id="adminEmail"
        ></span>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<main class="container">


<section class="stats">

    <div class="stat-card">

        <p>
            Total Orders
        </p>

        <h2 id="totalOrders">
            0
        </h2>

    </div>


    <div class="stat-card">

        <p>
            Total Sales
        </p>

        <h2 id="totalSales">
            ₹0
        </h2>

    </div>


    <div class="stat-card">

        <p>
            Pending Orders
        </p>

        <h2 id="pendingOrders">
            0
        </h2>

    </div>

</section>


<section class="orders-box">

    <div class="orders-header">

        <h2>
            📦 Orders
        </h2>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search order, name, mobile..."
            >

        </div>

    </div>


    <div
        id="loading"
        class="loading"
    >
        Loading orders...
    </div>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Order ID</th>

                    <th>Customer</th>

                    <th>Mobile</th>

                    <th>Amount</th>

                    <th>Payment</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="ordersTable">
            </tbody>

        </table>

    </div>

</section>

</main>

</div>



<!-- =========================
     MODAL
========================= -->

<div
    class="modal-overlay"
    id="modalOverlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2>
                📦 Order Details
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div id="orderDetails">
        </div>

    </div>

</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://hwenndtrljkckxmmdsyf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_FbLd2ncbSeeIE2KAjn2LFA_kQ7vV0Kx";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// LOGIN ELEMENTS
// ==========================================

const loginPage =
    document.getElementById(
        "loginPage"
    );

const adminPage =
    document.getElementById(
        "adminPage"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const loginError =
    document.getElementById(
        "loginError"
    );


// ==========================================
// CHECK LOGIN
// ==========================================

async function checkLogin() {

    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if (
        data.session
    ) {

        showAdmin(
            data.session.user
        );

    } else {

        showLogin();

    }

}


// ==========================================
// SHOW LOGIN
// ==========================================

function showLogin() {

    loginPage.style.display =
        "flex";

    adminPage.style.display =
        "none";

}


// ==========================================
// SHOW ADMIN
// ==========================================

function showAdmin(
    user
) {

    loginPage.style.display =
        "none";

    adminPage.style.display =
        "block";

    document.getElementById(
        "adminEmail"
    ).textContent =
        user.email || "";

    loadOrders();

}


// ==========================================
// LOGIN
// ==========================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById(
                "loginEmail"
            ).value.trim();


        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";

        loginError.style.display =
            "none";


        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        if (error) {

            loginError.textContent =
                "Login failed: " +
                error.message;

            loginError.style.display =
                "block";

            loginBtn.disabled =
                false;

            loginBtn.textContent =
                "Login";

            return;

        }


        showAdmin(
            data.user
        );

    }
);


// ==========================================
// LOGOUT
// ==========================================

async function logout() {

    await supabaseClient.auth.signOut();

    showLogin();

}


// ==========================================
// ORDERS
// ==========================================

let allOrders = [];


async function loadOrders() {

    const loading =
        document.getElementById(
            "loading"
        );

    loading.style.display =
        "block";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    loading.style.display =
        "none";


    if (error) {

        alert(
            "Orders load nahi ho pa rahe hain.\n\n" +
            error.message
        );

        return;

    }


    allOrders =
        data || [];


    updateStats();

    displayOrders(
        allOrders
    );

}


// ==========================================
// STATS
// ==========================================

function updateStats() {

    document.getElementById(
        "totalOrders"
    ).textContent =
        allOrders.length;


    let sales = 0;


    allOrders.forEach(
        function(order) {

            sales +=
                Number(
                    order.total_amount
                ) || 0;

        }
    );


    document.getElementById(
        "totalSales"
    ).textContent =
        "₹" +
        sales.toLocaleString(
            "en-IN"
        );


    const pending =
        allOrders.filter(
            function(order) {

                return (
                    order.status ===
                    "Order Placed"
                );

            }
        );


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending.length;

}


// ==========================================
// DISPLAY ORDERS
// ==========================================

function displayOrders(
    orders
) {

    const table =
        document.getElementById(
            "ordersTable"
        );


    table.innerHTML =
        "";


    orders.forEach(
        function(order) {

            const row =
                document.createElement(
                    "tr"
                );


            const id =
                String(
                    order.id
                );


            row.innerHTML = `

                <td>
                    <span class="order-id">
                        #${id.substring(0,8)}
                    </span>
                </td>

                <td>
                    ${escapeHTML(
                        order.customer_name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        order.mobile
                    )}
                </td>

                <td class="amount">
                    ₹${Number(
                        order.total_amount || 0
                    ).toLocaleString("en-IN")}
                </td>

                <td>
                    ${escapeHTML(
                        order.payment_method || "COD"
                    )}
                </td>

                <td>

                    <select
                        class="status-select"
                        onchange="changeStatus('${id}', this.value)"
                    >

                        <option value="Order Placed"
                        ${order.status === "Order Placed" ? "selected" : ""}>
                            Order Placed
                        </option>

                        <option value="Shipped"
                        ${order.status === "Shipped" ? "selected" : ""}>
                            Shipped
                        </option>

                        <option value="Out for Delivery"
                        ${order.status === "Out for Delivery" ? "selected" : ""}>
                            Out for Delivery
                        </option>

                        <option value="Delivered"
                        ${order.status === "Delivered" ? "selected" : ""}>
                            Delivered
                        </option>

                        <option value="Cancelled"
                        ${order.status === "Cancelled" ? "selected" : ""}>
                            Cancelled
                        </option>

                    </select>

                </td>

                <td>

                    <button
                        class="view-btn"
                        onclick="viewOrder('${id}')"
                    >
                        View
                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


// ==========================================
// CHANGE STATUS
// ==========================================

async function changeStatus(
    orderId,
    newStatus
) {

    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({

                status:
                    newStatus

            })
            .eq(
                "id",
                orderId
            );


    if (error) {

        alert(
            "Status update failed.\n\n" +
            error.message
        );

        return;

    }


    const order =
        allOrders.find(
            function(order) {

                return String(
                    order.id
                ) ===
                String(
                    orderId
                );

            }
        );


    if (order) {

        order.status =
            newStatus;

    }


    updateStats();

}


// ==========================================
// VIEW ORDER
// ==========================================

function viewOrder(
    orderId
) {

    const order =
        allOrders.find(
            function(order) {

                return String(
                    order.id
                ) ===
                String(
                    orderId
                );

            }
        );


    if (!order) {
        return;
    }


    let items =
        order.items;


    if (
        typeof items ===
        "string"
    ) {

        try {

            items =
                JSON.parse(
                    items
                );

        } catch {

            items =
                [];

        }

    }


    let itemsHTML =
        "";


    if (
        Array.isArray(items)
    ) {

        items.forEach(
            function(item) {

                itemsHTML += `

                    <div class="item-box">

                        <strong>
                            ${escapeHTML(
                                item.name || "Product"
                            )}
                        </strong>

                        <br>

                        Quantity:
                        ${item.quantity || 1}

                        <br>

                        Price:
                        ₹${Number(
                            item.price || 0
                        ).toLocaleString("en-IN")}

                    </div>

                `;

            }
        );

    }


    document.getElementById(
        "orderDetails"
    ).innerHTML = `

        <div class="detail-row">
            <strong>Order ID</strong>
            ${escapeHTML(String(order.id))}
        </div>

        <div class="detail-row">
            <strong>Customer</strong>
            ${escapeHTML(order.customer_name)}
        </div>

        <div class="detail-row">
            <strong>Mobile</strong>
            ${escapeHTML(order.mobile)}
        </div>

        <div class="detail-row">
            <strong>Address</strong>
            ${escapeHTML(order.address)}
        </div>

        <div class="detail-row">
            <strong>City</strong>
            ${escapeHTML(order.city)}
        </div>

        <div class="detail-row">
            <strong>PIN</strong>
            ${escapeHTML(order.pincode)}
        </div>

        <div class="detail-row">
            <strong>Payment</strong>
            ${escapeHTML(
                order.payment_method || "COD"
            )}
        </div>

        <div class="detail-row">
            <strong>Status</strong>
            ${escapeHTML(
                order.status || "Order Placed"
            )}
        </div>

        <div class="detail-row">
            <strong>Total</strong>
            ₹${Number(
                order.total_amount || 0
            ).toLocaleString("en-IN")}
        </div>

        <h3 style="margin:20px 0 10px;">
            🛍️ Products
        </h3>

        ${
            itemsHTML ||
            "<p>No products found.</p>"
        }

    `;


    document.getElementById(
        "modalOverlay"
    ).style.display =
        "flex";

}


// ==========================================
// CLOSE MODAL
// ==========================================

function closeModal() {

    document.getElementById(
        "modalOverlay"
    ).style.display =
        "none";

}


// ==========================================
// SEARCH
// ==========================================

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function() {

        const text =
            this.value
                .toLowerCase()
                .trim();


        if (!text) {

            displayOrders(
                allOrders
            );

            return;

        }


        const filtered =
            allOrders.filter(
                function(order) {

                    return (

                        String(
                            order.id
                        )
                        .toLowerCase()
                        .includes(text)

                        ||

                        String(
                            order.customer_name || ""
                        )
                        .toLowerCase()
                        .includes(text)

                        ||

                        String(
                            order.mobile || ""
                        )
                        .toLowerCase()
                        .includes(text)

                        ||

                        String(
                            order.status || ""
                        )
                        .toLowerCase()
                        .includes(text)

                    );

                }
            );


        displayOrders(
            filtered
        );

    }
);


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ==========================================
// START
// ==========================================

checkLogin();

</script>

</body>

</html>
