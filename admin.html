<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>EKart Mini - Admin Panel</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

/* =========================
   HEADER
========================= */

.header {
    height: 70px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: #6d28d9;
}

.admin-title {
    font-size: 14px;
    color: #666;
}

/* =========================
   MAIN
========================= */

.container {
    width: 90%;
    max-width: 1250px;
    margin: 30px auto;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 22px;
}

.stat-card p {
    color: #777;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-card h2 {
    font-size: 28px;
}

/* =========================
   ORDERS BOX
========================= */

.orders-box {
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 22px;
}

.orders-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.orders-header h2 {
    font-size: 22px;
}

.search-box {
    width: 280px;
}

.search-box input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #ddd;
    border-radius: 7px;
    outline: none;
}

.search-box input:focus {
    border-color: #6d28d9;
}

/* =========================
   TABLE
========================= */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th {
    text-align: left;
    background: #f8f8fb;
    padding: 13px;
    font-size: 13px;
    color: #555;
}

td {
    padding: 14px 13px;
    border-top: 1px solid #eee;
    font-size: 14px;
}

.order-id {
    font-weight: bold;
    color: #6d28d9;
}

.amount {
    font-weight: bold;
}

/* =========================
   STATUS
========================= */

.status-select {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ddd;
    outline: none;
    cursor: pointer;
}

.status-select:focus {
    border-color: #6d28d9;
}

/* =========================
   VIEW BUTTON
========================= */

.view-btn {
    border: none;
    background: #6d28d9;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.view-btn:hover {
    background: #4c1d95;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.5);

    z-index: 1000;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal {
    background: white;

    width: 100%;
    max-width: 600px;

    max-height: 90vh;

    overflow-y: auto;

    border-radius: 14px;

    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 20px;
}

.modal-header h2 {
    font-size: 21px;
}

.close-btn {
    border: none;
    background: none;
    font-size: 27px;
    cursor: pointer;
}

.detail-row {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.detail-row strong {
    display: inline-block;
    width: 120px;
}

.items-title {
    margin-top: 20px;
    margin-bottom: 10px;
}

.item-box {
    background: #f8f8fb;
    padding: 12px;
    border-radius: 7px;
    margin-bottom: 8px;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;
    padding: 40px;
    color: #777;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .orders-header {
        flex-direction: column;
        align-items: stretch;
    }

    .search-box {
        width: 100%;
    }

    .container {
        width: 94%;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        🛒 EKart Mini
    </div>

    <div class="admin-title">
        Admin Panel
    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- =====================
         STATS
    ====================== -->

    <section class="stats">

        <div class="stat-card">

            <p>
                Total Orders
            </p>

            <h2 id="totalOrders">
                0
            </h2>

        </div>


        <div class="stat-card">

            <p>
                Total Sales
            </p>

            <h2 id="totalSales">
                ₹0
            </h2>

        </div>


        <div class="stat-card">

            <p>
                Pending Orders
            </p>

            <h2 id="pendingOrders">
                0
            </h2>

        </div>

    </section>



    <!-- =====================
         ORDERS
    ====================== -->

    <section class="orders-box">

        <div class="orders-header">

            <h2>
                📦 Orders
            </h2>

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search order, name, mobile..."
                >

            </div>

        </div>


        <div
            id="loading"
            class="loading"
        >
            Loading orders...
        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Payment
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="ordersTable">

                </tbody>

            </table>

        </div>

    </section>

</main>



<!-- =========================
     MODAL
========================= -->

<div
    class="modal-overlay"
    id="modalOverlay"
>

    <div class="modal">

        <div class="modal-header">

            <h2>
                📦 Order Details
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div id="orderDetails">

        </div>

    </div>

</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://hwenndtrljkckxmmdsyf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_FbLd2ncbSeeIE2KAjn2LFA_kQ7vV0Kx";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// VARIABLES
// ==========================================

let allOrders = [];


// ==========================================
// ELEMENTS
// ==========================================

const ordersTable =
    document.getElementById(
        "ordersTable"
    );


const loading =
    document.getElementById(
        "loading"
    );


const totalOrders =
    document.getElementById(
        "totalOrders"
    );


const totalSales =
    document.getElementById(
        "totalSales"
    );


const pendingOrders =
    document.getElementById(
        "pendingOrders"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


// ==========================================
// LOAD ORDERS
// ==========================================

async function loadOrders() {

    loading.style.display =
        "block";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    loading.style.display =
        "none";


    if (error) {

        console.error(
            error
        );

        alert(
            "Orders load nahi ho pa rahe hain.\n\n" +
            error.message
        );

        return;
    }


    allOrders =
        data || [];


    updateStats();

    displayOrders(
        allOrders
    );

}


// ==========================================
// STATS
// ==========================================

function updateStats() {

    totalOrders.textContent =
        allOrders.length;


    let sales = 0;


    allOrders.forEach(
        function(order) {

            sales +=
                Number(
                    order.total_amount
                ) || 0;

        }
    );


    totalSales.textContent =
        "₹" +
        sales.toLocaleString(
            "en-IN"
        );


    const pending =
        allOrders.filter(
            function(order) {

                return (
                    order.status ===
                    "Order Placed"
                );

            }
        );


    pendingOrders.textContent =
        pending.length;

}


// ==========================================
// DISPLAY ORDERS
// ==========================================

function displayOrders(
    orders
) {

    ordersTable.innerHTML =
        "";


    if (
        orders.length === 0
    ) {

        ordersTable.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    style="text-align:center;padding:30px;"
                >
                    No orders found.
                </td>

            </tr>

        `;

        return;
    }


    orders.forEach(
        function(order) {

            const row =
                document.createElement(
                    "tr"
                );


            const id =
                String(
                    order.id
                );


            row.innerHTML = `

                <td>

                    <span class="order-id">
                        #${id.substring(0,8)}
                    </span>

                </td>


                <td>
                    ${escapeHTML(
                        order.customer_name
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        order.mobile
                    )}
                </td>


                <td class="amount">

                    ₹${Number(
                        order.total_amount || 0
                    ).toLocaleString("en-IN")}

                </td>


                <td>
                    ${escapeHTML(
                        order.payment_method || "COD"
                    )}
                </td>


                <td>

                    <select
                        class="status-select"
                        onchange="changeStatus('${id}', this.value)"
                    >

                        <option
                            value="Order Placed"
                            ${order.status === "Order Placed" ? "selected" : ""}
                        >
                            Order Placed
                        </option>

                        <option
                            value="Shipped"
                            ${order.status === "Shipped" ? "selected" : ""}
                        >
                            Shipped
                        </option>

                        <option
                            value="Out for Delivery"
                            ${order.status === "Out for Delivery" ? "selected" : ""}
                        >
                            Out for Delivery
                        </option>

                        <option
                            value="Delivered"
                            ${order.status === "Delivered" ? "selected" : ""}
                        >
                            Delivered
                        </option>

                        <option
                            value="Cancelled"
                            ${order.status === "Cancelled" ? "selected" : ""}
                        >
                            Cancelled
                        </option>

                    </select>

                </td>


                <td>

                    <button
                        class="view-btn"
                        onclick="viewOrder('${id}')"
                    >
                        View
                    </button>

                </td>

            `;


            ordersTable.appendChild(
                row
            );

        }
    );

}


// ==========================================
// CHANGE STATUS
// ==========================================

async function changeStatus(
    orderId,
    newStatus
) {

    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({

                status:
                    newStatus

            })
            .eq(
                "id",
                orderId
            );


    if (error) {

        console.error(
            error
        );

        alert(
            "Status update nahi hua.\n\n" +
            error.message
        );

        return;
    }


    const order =
        allOrders.find(
            function(order) {

                return String(
                    order.id
                ) === String(
                    orderId
                );

            }
        );


    if (order) {

        order.status =
            newStatus;

    }


    updateStats();

    alert(
        "Order status updated! ✅"
    );

}


// ==========================================
// VIEW ORDER
// ==========================================

function viewOrder(
    orderId
) {

    const order =
        allOrders.find(
            function(order) {

                return String(
                    order.id
                ) === String(
                    orderId
                );

            }
        );


    if (!order) {

        return;

    }


    const details =
        document.getElementById(
            "orderDetails"
        );


    let itemsHTML =
        "";


    let items =
        order.items;


    if (
        typeof items ===
        "string"
    ) {

        try {

            items =
                JSON.parse(
                    items
                );

        } catch {

            items =
                [];

        }

    }


    if (
        Array.isArray(items)
    ) {

        items.forEach(
            function(item) {

                itemsHTML += `

                    <div class="item-box">

                        <strong>
                            ${escapeHTML(
                                item.name || "Product"
                            )}
                        </strong>

                        <br>

                        Quantity:
                        ${item.quantity || 1}

                        <br>

                        Price:
                        ₹${Number(
                            item.price || 0
                        ).toLocaleString("en-IN")}

                    </div>

                `;

            }
        );

    }


    details.innerHTML = `

        <div class="detail-row">

            <strong>
                Order ID
            </strong>

            ${escapeHTML(
                String(order.id)
            )}

        </div>


        <div class="detail-row">

            <strong>
                Customer
            </strong>

            ${escapeHTML(
                order.customer_name
            )}

        </div>


        <div class="detail-row">

            <strong>
                Mobile
            </strong>

            ${escapeHTML(
                order.mobile
            )}

        </div>


        <div class="detail-row">

            <strong>
                Address
            </strong>

            ${escapeHTML(
                order.address
            )}

        </div>


        <div class="detail-row">

            <strong>
                City
            </strong>

            ${escapeHTML(
                order.city
            )}

        </div>


        <div class="detail-row">

            <strong>
                PIN Code
            </strong>

            ${escapeHTML(
                order.pincode
            )}

        </div>


        <div class="detail-row">

            <strong>
                Payment
            </strong>

            ${escapeHTML(
                order.payment_method || "COD"
            )}

        </div>


        <div class="detail-row">

            <strong>
                Status
            </strong>

            ${escapeHTML(
                order.status || "Order Placed"
            )}

        </div>


        <div class="detail-row">

            <strong>
                Total
            </strong>

            ₹${Number(
                order.total_amount || 0
            ).toLocaleString("en-IN")}

        </div>


        <h3 class="items-title">
            🛍️ Products
        </h3>


        ${itemsHTML || "<p>No product information.</p>"}

    `;


    document.getElementById(
        "modalOverlay"
    ).style.display =
        "flex";

}


// ==========================================
// CLOSE MODAL
// ==========================================

function closeModal() {

    document.getElementById(
        "modalOverlay"
    ).style.display =
        "none";

}


// ==========================================
// SEARCH
// ==========================================

searchInput.addEventListener(
    "input",
    function() {

        const text =
            searchInput.value
                .toLowerCase()
                .trim();


        if (
            text === ""
        ) {

            displayOrders(
                allOrders
            );

            return;

        }


        const filtered =
            allOrders.filter(
                function(order) {

                    return (

                        String(
                            order.id
                        )
                        .toLowerCase()
                        .includes(text)

                        ||

                        String(
                            order.customer_name || ""
                        )
                        .toLowerCase()
                        .includes(text)

                        ||

                        String(
                            order.mobile || ""
                        )
                        .toLowerCase()
                        .includes(text)

                        ||

                        String(
                            order.status || ""
                        )
                        .toLowerCase()
                        .includes(text)

                    );

                }
            );


        displayOrders(
            filtered
        );

    }
);


// ==========================================
// SECURITY HELPER
// ==========================================

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ==========================================
// START
// ==========================================

loadOrders();

</script>

</body>

</html>
