<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKart Mini - Product</title>
<link rel="icon" href="data:,">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f7f8fc;color:#1f2937}
.header{min-height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;gap:20px;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:800;color:#6d28d9}
.header-actions{display:flex;gap:10px}
.header-actions button{border:1px solid #ddd;background:#fff;padding:10px 14px;border-radius:7px;cursor:pointer}
.cart-count{background:#ef4444;color:#fff;border-radius:50%;padding:2px 7px;font-size:12px;margin-left:3px}
.container{width:90%;max-width:1200px;margin:25px auto}
.back{display:inline-block;color:#6d28d9;text-decoration:none;margin-bottom:18px;font-weight:bold}
.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:#fff;border:1px solid #eee;border-radius:14px;padding:22px}
.gallery{display:grid;grid-template-columns:82px 1fr;gap:14px}
.thumbs{display:flex;flex-direction:column;gap:10px}
.thumb{width:76px;height:76px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;object-fit:contain}
.thumb.active{border:2px solid #6d28d9}
.main-image{width:100%;height:500px;background:#f5f5f5;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.main-image img{width:100%;height:100%;object-fit:contain}
.info{padding:5px 8px}
.category{color:#6d28d9;font-size:13px;margin-bottom:10px}
h1{font-size:30px;margin-bottom:12px}
.price{font-size:27px;font-weight:bold;margin:14px 0}
.description{color:#666;line-height:1.6;white-space:pre-line;margin-bottom:22px}
.section-title{font-weight:bold;margin:18px 0 10px}
.options{display:flex;flex-wrap:wrap;gap:9px}
.option{border:1px solid #bbb;background:#fff;padding:9px 15px;border-radius:20px;cursor:pointer}
.option:hover{border-color:#6d28d9}
.option.selected{border:2px solid #6d28d9;color:#6d28d9;padding:8px 14px;font-weight:bold}
.option.disabled{opacity:.45;cursor:not-allowed}
.quantity{display:flex;align-items:center;gap:12px;margin:10px 0 22px}
.quantity button{width:34px;height:34px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-size:18px}
.quantity span{min-width:25px;text-align:center;font-weight:bold}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.buttons button{padding:14px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}
.add{border:1px solid #6d28d9;background:#fff;color:#6d28d9}
.buy{border:none;background:#6d28d9;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
#loading,#error{text-align:center;padding:60px}
#error{color:#dc2626}
@media(max-width:800px){
.header{padding:12px 4%}.product-layout{grid-template-columns:1fr;padding:14px}.gallery{grid-template-columns:65px 1fr}.thumb{width:60px;height:60px}.main-image{height:380px}h1{font-size:24px}.buttons{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">🛒 EKart Mini</div>
  <div class="header-actions">
    <button onclick="location.href='index.html'">🏠 Home</button>
    <button onclick="location.href='index.html#products'">🛒 Cart <span id="cartCount" class="cart-count">0</span></button>
  </div>
</header>

<main class="container">
  <a class="back" href="javascript:history.back()">← Back</a>
  <div id="loading">Loading product...</div>
  <div id="error" style="display:none"></div>

  <section id="productSection" class="product-layout" style="display:none">
    <div class="gallery">
      <div id="thumbs" class="thumbs"></div>
      <div class="main-image"><img id="mainImage" alt="Product"></div>
    </div>

    <div class="info">
      <div id="category" class="category"></div>
      <h1 id="name"></h1>
      <div id="price" class="price"></div>
      <div id="description" class="description"></div>

      <div id="colorSection" style="display:none">
        <div class="section-title">Select Color</div>
        <div id="colors" class="options"></div>
      </div>

      <div id="sizeSection" style="display:none">
        <div class="section-title">Select Size</div>
        <div id="sizes" class="options"></div>
      </div>

      <div class="section-title">Quantity</div>
      <div class="quantity">
        <button onclick="changeQty(-1)">−</button>
        <span id="quantity">1</span>
        <button onclick="changeQty(1)">+</button>
      </div>

      <div id="stockText" style="margin-bottom:18px;color:#16a34a;font-size:14px"></div>

      <div class="buttons">
        <button class="add" id="addBtn" onclick="addToCart()">🛒 Add to Cart</button>
        <button class="buy" id="buyBtn" onclick="buyNow()">⚡ Buy Now</button>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://hwenndtrljkckxmmdsyf.supabase.co";
const SUPABASE_KEY="sb_publishable_FbLd2ncbSeeIE2KAjn2LFA_kQ7vV0Kx";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let product=null;
let quantity=1;
let selectedColor="";
let selectedSize="";

function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function getId(){
  return new URLSearchParams(location.search).get("id");
}

function parseOptions(value){
  if(Array.isArray(value)) return value.map(String).map(x=>x.trim()).filter(Boolean);
  if(value===null||value===undefined) return [];
  return String(value).split(",").map(x=>x.trim()).filter(Boolean);
}

async function loadProduct(){
  const id=getId();
  if(!id){showError("Product ID nahi mila.");return;}

  const {data,error}=await supabaseClient
    .from("products")
    .select("*")
    .eq("id",id)
    .single();

  if(error||!data){
    showError("Product load nahi ho pa raha hai.");
    console.error(error);
    return;
  }

  product=data;
  document.title=(product.name||"Product")+" - EKart Mini";

  document.getElementById("loading").style.display="none";
  document.getElementById("productSection").style.display="grid";

  document.getElementById("category").textContent=product.category||"";
  document.getElementById("name").textContent=product.name||"Product";
  document.getElementById("price").textContent="₹"+Number(product.price||0).toLocaleString("en-IN");
  document.getElementById("description").textContent=product.description||"";

  const stock=Number(product.stock||0);
  document.getElementById("stockText").textContent=stock>0?("In Stock • "+stock+" available"):"Out of Stock";
  if(stock<=0){
    document.getElementById("addBtn").disabled=true;
    document.getElementById("buyBtn").disabled=true;
  }

  setupGallery();
  setupOptions();
  updateCartCount();
}

function showError(msg){
  document.getElementById("loading").style.display="none";
  const e=document.getElementById("error");
  e.style.display="block";
  e.textContent=msg;
}

function setupGallery(){
  const urls=[product.image,product.image2,product.image3,product.image4,product.image5]
    .map(x=>String(x||"").trim()).filter(Boolean);

  const thumbs=document.getElementById("thumbs");
  thumbs.innerHTML="";

  if(urls.length===0){
    document.getElementById("mainImage").style.display="none";
    return;
  }

  document.getElementById("mainImage").src=urls[0];

  urls.forEach((url,i)=>{
    const img=document.createElement("img");
    img.className="thumb"+(i===0?" active":"");
    img.src=url;
    img.alt="Product image "+(i+1);
    img.onerror=()=>img.style.display="none";
    img.onclick=()=>{
      document.getElementById("mainImage").src=url;
      document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));
      img.classList.add("active");
    };
    thumbs.appendChild(img);
  });
}

function setupOptions(){
  const colors=parseOptions(product.colors);
  const sizes=parseOptions(product.sizes);

  if(colors.length){
    document.getElementById("colorSection").style.display="block";
    const box=document.getElementById("colors");
    colors.forEach((color,i)=>{
      const b=document.createElement("button");
      b.type="button"; b.className="option"; b.textContent=color;
      b.onclick=()=>{
        selectedColor=color;
        box.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
        b.classList.add("selected");
      };
      box.appendChild(b);
    });
  }

  if(sizes.length){
    document.getElementById("sizeSection").style.display="block";
    const box=document.getElementById("sizes");
    sizes.forEach(size=>{
      const b=document.createElement("button");
      b.type="button"; b.className="option"; b.textContent=size;
      b.onclick=()=>{
        selectedSize=size;
        box.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
        b.classList.add("selected");
      };
      box.appendChild(b);
    });
  }
}

function changeQty(amount){
  const stock=Number(product?.stock||0);
  quantity=Math.max(1,quantity+amount);
  if(stock>0) quantity=Math.min(stock,quantity);
  document.getElementById("quantity").textContent=quantity;
}

function makeCartItem(){
  return {
    id:product.id,
    name:product.name||"Product",
    product_code:product.product_code||"",
    price:Number(product.price||0),
    image:product.image||"",
    quantity:quantity,
    color:selectedColor||"",
    size:selectedSize||""
  };
}

function addToCart(){
  if(!product) return;
  const colors=parseOptions(product.colors);
  const sizes=parseOptions(product.sizes);

  if(colors.length&&!selectedColor){alert("Please select a color.");return;}
  if(sizes.length&&!selectedSize){alert("Please select a size.");return;}

  let cart=[];
  try{cart=JSON.parse(localStorage.getItem("ekartCart"))||[];}catch{cart=[];}
  if(!Array.isArray(cart))cart=[];

  const item=makeCartItem();
  const existing=cart.find(x=>String(x.id)===String(item.id)&&
    String(x.color||"")===String(item.color||"")&&
    String(x.size||"")===String(item.size||""));

  if(existing){
    existing.quantity=Math.min(Number(product.stock||999999),Number(existing.quantity||0)+quantity);
  }else{
    cart.push(item);
  }

  localStorage.setItem("ekartCart",JSON.stringify(cart));
  updateCartCount();
  alert("Product cart me add ho gaya! 🛒");
}

function buyNow(){
  if(!product) return;
  const colors=parseOptions(product.colors);
  const sizes=parseOptions(product.sizes);

  if(colors.length&&!selectedColor){alert("Please select a color.");return;}
  if(sizes.length&&!selectedSize){alert("Please select a size.");return;}

  localStorage.setItem("ekartCart",JSON.stringify([makeCartItem()]));
  location.href="checkout.html";
}

function updateCartCount(){
  let cart=[];
  try{cart=JSON.parse(localStorage.getItem("ekartCart"))||[];}catch{cart=[];}
  const count=Array.isArray(cart)?cart.reduce((s,x)=>s+(Number(x.quantity)||1),0):0;
  document.getElementById("cartCount").textContent=count;
}

loadProduct();
</script>
</body>
</html>
